- id: rfc8594-sunset-header
  conforms: false
  evidence: no Sunset or Deprecation header support documented; no deprecation policy published
- id: json-api
  conforms: false
  evidence: responses are bare JSON objects with no data/attributes envelope
- id: openapi
  conforms: partial
  evidence: >-
    UVeye publishes a Postman Collection v2.0.0, not an OpenAPI document. The OpenAPI 3.1.0 in
    openapi/ is derived by API Evangelist from that collection and is not published by UVeye.
- id: asyncapi
  conforms: false
  evidence: one documented outbound webhook, no AsyncAPI document published
- id: cursor-pagination
