summary: >-
  UVeye holds published organisational security certifications (ISO/IEC 27001:2022 and SOC 2 Type 2,
  evidenced on its SafeBase trust center) but asserts no API-level or industry data standard. The
  Public API v1 is a proprietary RPC-over-POST JSON contract: no OAuth, no OIDC, no RFC 9457 problem
  details, no JSON:API, no standard pagination and no published AsyncAPI or OpenAPI of its own.
