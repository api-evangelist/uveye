summary: >-
  UVeye versions its API in the URI path (v1) and versions its documentation separately (v1.2,
  2026-07-06). It publishes a changelog inline in the API documentation but no deprecation policy, no
  Sunset/Deprecation header support, no SLA and no public status page. One endpoint (Inspection
  Feedback) was removed in v1.1 and documented after the fact rather than announced with a sunset
  window.
