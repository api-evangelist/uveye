apis:
- aid: uveye:public-api-v1
  name: UVeye Public API v1
  description: 'Third-party access to UVeye vehicle inspection data. Retrieve full inspection records
    (Artemis tires, Helios undercarriage, Atlas exterior, Apollo interior) by inspection id, VIN,
    license plate or barcode; discover the latest inspections for a site or site group; mint
    customer-facing public inspection links that expire after 30 days; pull appraisal/quote data with
    damages grouped by car part; fetch inspection imagery; and submit dealer inventory to the
    Merchandise surface, which renders multi-angle imagery and delivers it back over a signed
    webhook. Most endpoints authenticate with a uveye-api-key header generated in the UVeye Back
    Office; the Merchandise endpoints use a separate bearer credential issued at onboarding.'
