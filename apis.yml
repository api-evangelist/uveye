aid: uveye
name: UVeye
description: 'UVeye builds AI-powered automated vehicle inspection systems — "the MRI for cars" —
  that drive a vehicle through a scanning lane and produce a full condition report in seconds. Four
  scanning modules cover the vehicle: Artemis (tires and tread), Helios (undercarriage), Atlas
  (exterior body damage) and Apollo (interior). The systems are deployed across dealership service
  lanes, fleet and leasing depots, auctions and remarketing lots, rental returns, OEM manufacturing
  and logistics/PDI ports. UVeye exposes the resulting inspection data to third parties through the
  UVeye Public API v1 — inspection detail lookups by VIN, license plate, inspection id or barcode,
  latest-inspection discovery by site or site group, customer-facing public inspection links,
  appraisal/quote data, inspection imagery, and a Merchandise surface that ingests dealer inventory
  and pushes rendered multi-angle imagery back over a signed webhook. Headquartered in Teaneck, New
  Jersey with offices in Norcross GA, Tel Aviv and London.'
