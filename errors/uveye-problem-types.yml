silent_failures:
- surface: submitMerchandiseInventory
  description: >-
    Merchandise batches are processed asynchronously and the 202 response carries no per-VIN
    validation. A malformed or incomplete VIN is silently excluded from the batch and simply never
    produces a webhook. Retain the returned requestId for support.
