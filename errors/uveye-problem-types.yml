format: proprietary
envelope:
  description: >-
    UVeye does not use RFC 9457 problem+json. Errors are returned as the documented HTTP status code
    with a short human-readable message string; the documentation publishes the exact message text
    per status per endpoint. There is no machine-readable error code field, no error type URI and no
    problem+json media type anywhere in the published contract.
  rfc9457: false
  media_type: application/json
