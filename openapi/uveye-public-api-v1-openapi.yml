        count:
          type: integer
webhooks:
  merchandiseImagesReady:
    post:
      operationId: merchandiseImagesReadyWebhook
      summary: Merchandise images ready (delivered by UVeye to your endpoint)
      description: 'When a VIN''s merchandise images are ready, UVeye POSTs to your configured webhook
        URL.


        `Authorization: Bearer <customer-bearer-token>` carries the token UVeye was given at onboarding
        - match it to authenticate UVeye. `X-UVeye-Signature` is an HS256 JWT binding the body (`body_sha256`);
        verify it for tamper detection, and it carries a `delivery_id` idempotency key (optional).


        Acknowledge with 2xx. A non-2xx triggers retry - up to 5 retries / 6 attempts, same `delivery_id`.


        The minimum body is shown below (default). A detailed format (opt-in at onboarding) adds `publishStatus`,
        `coverImage`, `imageCount`, per-image `{ url, category }`, and `modules`.'
      tags:
      - Merchandise
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        description: '`Bearer <customer-bearer-token>` - the token UVeye was given at onboarding.'
      - name: X-UVeye-Signature
        in: header
        required: true
        schema:
          type: string
        description: HS256 JWT binding the body (`body_sha256`) and carrying a `delivery_id` idempotency
          key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vin:
                  type: string
                publishedAt:
                  type: string
                  format: date-time
                images:
                  type: array
                  items:
                    type: string
                    format: uri
            example:
              vin: 1G1ZD5ST7JF123456
              publishedAt: '2026-05-12T10:34:00Z'
              images:
              - https://<image-cdn-host>/.../front-left.jpg
              - https://<image-cdn-host>/.../front-right.jpg
              - https://<image-cdn-host>/.../rear-left.jpg
              - https://<image-cdn-host>/.../rear-right.jpg
      responses:
        2xx:
          description: Acknowledged. A non-2xx response triggers retry (up to 5 retries / 6 attempts,
            same delivery_id).
