openapi: 3.1.0
info:
  title: UVeye Public API v1
  version: '1.2'
  summary: Third-party access to UVeye automated vehicle-inspection data.
  description: 'Allows third-party access to UVeye''s vehicle inspection data. Inspections are produced
    by UVeye''s scanning systems and exposed through four modules: **Artemis** (tires), **Helios** (undercarriage),
    **Atlas** (exterior) and **Apollo** (interior). The API also carries the **Merchandise** surface,
    which accepts a dealer''s vehicle inventory and pushes rendered multi-angle imagery back over a webhook.


    All data provided is confidential and may not be used in any way without explicit permission from
    UVeye.


    Most endpoints authenticate with a `uveye-api-key` header, generated in the Global Keys tab of the
    UVeye Back Office. The Merchandise endpoints use a separate credential sent as `Authorization: Bearer
    <merchandise API key>`, issued at onboarding.


    This document is DERIVED by API Evangelist from UVeye''s own published Postman collection (documentation
    version v1.2, 2026-07-06) at https://api.v1.uveye.dev/. It is not published by UVeye.'
  contact:
    name: UVeye Customer Support
    url: https://uveye.com/customer-support/
  x-origin:
  - format: postman
    version: 2.0.0
    url: https://api.v1.uveye.dev/
    converter:
      name: api-evangelist enrichment pipeline
      version: local-v1
servers:
- url: https://api.uveye.dev/v1
  description: Development environment (base URL published in the API documentation).
- url: https://api-uveye-playground.web.app/v1/i
  description: Staging / playground environment (base_url from the published Postman Staging environment).
externalDocs:
  description: UVeye Public API v1 documentation (Postman)
  url: https://api.v1.uveye.dev/
security:
- uveyeApiKey: []
tags:
- name: Inspections
  description: Retrieve vehicle inspection data and the most recent inspections for a site or site group.
- name: Public Links
  description: Generate and record customer-facing public inspection links.
- name: Appraisal
  description: Appraisal / quote data derived from an inspection.
- name: Media
  description: Inspection imagery.
- name: Merchandise
  description: Submit dealer inventory for merchandising and mark vehicles sold.
paths:
  /inspection:
    post:
      operationId: getInspectionDetails
      summary: Get inspection details
      description: Returns the full inspection record for a vehicle. One of `inspectionId`, `vin`, `licensePlate`
        or `uniqueId` must be supplied. The response nests the Artemis (tires), Helios (undercarriage),
        Atlas (exterior) and Apollo (interior) module objects.
      tags:
      - Inspections
      security:
      - uveyeApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectionLookup'
            examples:
              byInspectionId:
                summary: Look up by inspection id
                value:
                  inspectionId: 79c0c1d0-f600-413d-87f1-7e2f70d03ecb
      responses:
        '200':
          description: The inspection record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inspection'
              example:
                inspectionId: 8b14a050-713c-4cb5-bbea-4eed7e05a376
                artemis:
                  leftFront:
                    treadImage: https://staging.api.uveye.app/v1/image?key=WGP6HmH74NVV2U9DIyGk
                    wallImage: https://staging.api.uveye.app/v1/image?key=biyzj84gqGtf0cEL48FQ
                    treadDetections: []
                    wallDetections: []
                    brand: ''
                    dot: ''
                    tireAge: ''
                    pressure: ''
                    size: ''
                    speedAndLoad: ''
                    unevenTreadsWearDetected: null
                    wornTireDetected: ''
                    isMountingCorrect: null
                    isAllSeasonPresent: null
                    isSpeedAndLoadNormal: null
                    grooves: []
                  leftRear:
                    treadImage: https://staging.api.uveye.app/v1/image?key=hDkAkn9Uwm0eOwum4DUO
                    wallImage: https://staging.api.uveye.app/v1/image?key=oM5zL0ztwFYvd8ikqwBN
                    treadDetections: []
                    wallDetections: []
                    brand: ''
                    dot: ''
                    tireAge: ''
                    pressure: ''
                    size: ''
                    speedAndLoad: ''
                    unevenTreadsWearDetected: null
                    wornTireDetected: ''
                    isMountingCorrect: null
                    isAllSeasonPresent: null
                    isSpeedAndLoadNormal: null
                    grooves: []
                  rightFront:
                    treadImage: https://staging.api.uveye.app/v1/image?key=boYhKvRao57Cb0lmCSCT
                    wallImage: https://staging.api.uveye.app/v1/image?key=Jis7NFgxkaFwFbXfDzIv
                    treadDetections: []
                    wallDetections: []
                    brand: ''
                    dot: ''
                    tireAge: ''
                    pressure: ''
                    size: ''
                    speedAndLoad: ''
                    unevenTreadsWearDetected: null
                    wornTireDetected: ''
                    isMountingCorrect: null
                    isAllSeasonPresent: null
                    isSpeedAndLoadNormal: null
                    grooves: []
                  rightRear:
                    treadImage: https://staging.api.uveye.app/v1/image?key=IXjyBMmDP9JyDVTpyDQN
                    wallImage: https://staging.api.uveye.app/v1/image?key=d0hsklrrquyCoXF6CnB1
