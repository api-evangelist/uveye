        '400':
          description: Bad Request - Request failed, or required search criteria are missing from the
            request body.
        '401':
          description: Unauthorized - `Invalid API key` or `API key is disabled`. Refresh the key in the
            UVeye Back Office and resend it in the `uveye-api-key` header.
        '404':
          description: Not Found - Inspection not found - the inspection expired, or the supplied identifier
            is wrong.
        '405':
          description: Method Not Allowed - `unknown method, please use POST` - the endpoint only accepts
            POST.
  /latest-inspections:
    post:
      operationId: listLatestInspections
      summary: List latest inspections
      description: Returns the most recent inspections for a site, site group or VIN so you can discover
        the `inspectionId` values to use with the Inspection Details request.
      tags:
      - Inspections
      security:
      - uveyeApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LatestInspectionsQuery'
            examples:
              byDays:
                summary: Last 100 days for a site
                value:
                  siteId: <site id>
                  amountOfDaysForSearch: 100
      responses:
        '200':
          description: The matching inspections.
          content:
            application/json:
              schema:
                type: object
                properties:
                  inspections:
                    type: array
                    items:
                      $ref: '#/components/schemas/InspectionSummary'
              example: null
        '400':
          description: Bad Request - Request failed, or required search criteria are missing from the
            request body.
        '401':
          description: Unauthorized - `Invalid API key` or `API key is disabled`. Refresh the key in the
            UVeye Back Office and resend it in the `uveye-api-key` header.
        '404':
          description: Not Found - Inspection not found - the inspection expired, or the supplied identifier
            is wrong.
        '405':
          description: Method Not Allowed - `unknown method, please use POST` - the endpoint only accepts
            POST.
  /public-link:
    post:
      operationId: createInspectionPublicLink
      summary: Create an inspection public link
      description: Returns a shareable public link to an inspection. Public inspection links expire 30
        days after they are generated; the exact expiry is returned in `expirationDate`.
      tags:
      - Public Links
      security:
      - uveyeApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicLinkRequest'
            examples:
              byInspectionId:
                value:
                  inspectionId: 79c0c1d0-f600-413d-87f1-7e2f70d03ecb
                  plainMode: false
      responses:
        '200':
          description: The public link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicLink'
              example: null
        '400':
          description: Bad Request - Request failed, or required search criteria are missing from the
            request body.
        '401':
          description: Unauthorized - `Invalid API key` or `API key is disabled`. Refresh the key in the
            UVeye Back Office and resend it in the `uveye-api-key` header.
        '404':
          description: Not Found - Inspection not found - the inspection expired, or the supplied identifier
            is wrong.
        '405':
          description: Method Not Allowed - `unknown method, please use POST` - the endpoint only accepts
            POST.
  /inspection-shared:
    post:
      operationId: recordInspectionShared
      summary: Record that an inspection was shared
      description: Records that an inspection's public link was shared with a customer. Call this after
        sending a public link so the share is logged in the UVeye system. Returns 200 with an empty body
        on success.
      tags:
      - Public Links
      security:
      - uveyeApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - inspectionId
              properties:
                inspectionId:
                  type: string
                  description: Unique id of the inspection that was shared.
                publicLinkUrl:
                  type: string
                  description: The public inspection link that was sent to the customer.
            examples:
              withLink:
                value:
                  inspectionId: '1234567890'
                  publicLinkUrl: https://us.uvpub.uveye.app/public/ABCDEF123456
              idOnly:
                value:
                  inspectionId: '1234567890'
      responses:
        '200':
          description: The share was recorded. Empty body.
        '400':
          description: Bad Request - inspectionId is missing or the request is malformed.
        '401':
          description: Unauthorized - `Invalid API key` or `API key is disabled`. Refresh the key in the
            UVeye Back Office and resend it in the `uveye-api-key` header.
        '405':
          description: Method Not Allowed - `unknown method, please use POST` - the endpoint only accepts
            POST.
  /quote:
    post:
      operationId: getQuoteByInspection
      summary: Get appraisal quote data for an inspection
      description: 'Returns the appraisal data of an inspection: basic vehicle information, the public
        quote link, the offer price and total reconditioning cost (when available), and damages grouped
        by car part. Each `defects[]` entry is one car part; its `damages[]` array holds the estimated
        repairs for that part, and each repair carries its own `damages[]` array of supporting images.
        The inspected vehicle must have a related appraisal ready on uvcamp.'
      tags:
      - Appraisal
      security:
      - uveyeApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
            examples:
              byInspectionId:
                value:
                  inspectionId: 30a54b98-6fd6-4a96-9b6b-da8885d7c826
                  includeImages: true
      responses:
        '200':
          description: The appraisal quote.
          content:
            application/json:
              schema:
                type: object
                description: Appraisal quote payload - see the example for the published shape.
              example:
                inspectionId: 2b16873e-31de-4e84-9a5c-6e5eb0020536
                licensePlate: Z865YY
                vin: JTMWFREV4HD096740
                make: TOYOTA
