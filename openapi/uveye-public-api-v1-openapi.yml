  /image:
    get:
      operationId: getInspectionImage
      summary: Get an inspection image
      description: Returns an image acquired during a UVeye inspection, identified by a `key` query parameter.
        You normally do not build this request yourself - image URLs returned inside other endpoints'
        responses (overviewImage, coverImage, tire treadImage/wallImage, detection image/croppedImage,
        Atlas coverImages/animatedFrames) already include the `?key=` parameter; use the returned URL
        as-is. Image URLs are valid for 1 hour unless stated otherwise.
      tags:
      - Media
      security:
      - uveyeApiKey: []
      parameters:
      - name: key
        in: query
        required: true
        schema:
          type: string
        description: The image key, taken from an image URL returned by another endpoint.
      responses:
        '200':
          description: The raw image.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized - `Invalid API key` or `API key is disabled`. Refresh the key in the
            UVeye Back Office and resend it in the `uveye-api-key` header.
        '404':
          description: Not Found - the image key is unknown or the URL has expired (image URLs expire
            after 1 hour).
  /merchandise/inventory/vehicles:
    post:
      operationId: submitMerchandiseInventory
      summary: Submit inventory
      description: 'Push VINs plus basic vehicle data; UVeye scans, renders multi-angle images and pushes
        them back to your webhook. Batch limit is 100 vehicles per request (more returns 413). Resubmit
        your full active inventory periodically (for example every 4 hours) - unchanged vehicles are no-ops,
        deduplicated by content hash. Processed asynchronously: there is no per-VIN validation in the
        response, and a malformed or incomplete VIN is excluded and simply never produces a webhook.'
      tags:
      - Merchandise
      security:
      - merchandiseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - vehicles
              properties:
                vehicles:
                  type: array
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/MerchandiseVehicle'
            example:
              vehicles:
              - vin: 1G1ZD5ST7JF123456
                make: Chevrolet
                model: Malibu
                year: 2024
                color: Silver
                body: Sedan
                stockNumber: ST-12345
                mileage: 12500
                type: USED
                sellingPrice: 21500
      responses:
        '202':
          description: Accepted for asynchronous processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchandiseAccepted'
              example:
                received: true
                requestId: f1a3b2c5-8e9d-4a6f-9c8e-1d2b3a4e5f6c
                count: 78
        '400':
          description: Bad Request - malformed body or a missing required field.
        '401': &id001
          description: Unauthorized - the merchandise key is missing, invalid, disabled, or not authorized
            for merchandise.
        '413': &id002
          description: Payload Too Large - more than 100 vehicles in a single request.
  /merchandise/inventory/sold:
    post:
      operationId: markMerchandiseVehiclesSold
      summary: Mark vehicles sold
      description: Mark vehicles sold so UVeye stops merchandising them. Call this explicitly when a VIN
        sells - v1 does not auto-detect sold vehicles from their absence in a resubmitted inventory. To
        bring a sold VIN back, resubmit it via Submit inventory. Same 100-vehicle batch limit.
      tags:
      - Merchandise
      security:
      - merchandiseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - vins
              properties:
                vins:
                  type: array
                  maxItems: 100
                  items:
                    type: string
            example:
              vins:
              - 1G1ZD5ST7JF123456
              - 1HGCM82633A004352
      responses:
        '202':
          description: Accepted for asynchronous processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchandiseAccepted'
              example:
                received: true
                requestId: a7c9e1d3-4b6f-4c2a-8e1d-9f3b2a4c6d8e
                count: 2
        '400':
          description: Bad Request - missing/empty `vins` or a non-string entry.
        '401': *id001
        '413': *id002
components:
  securitySchemes:
    uveyeApiKey:
      type: apiKey
      in: header
      name: uveye-api-key
      description: Global API key generated in the Global Keys tab of the UVeye Back Office.
    merchandiseBearer:
      type: http
      scheme: bearer
      description: 'Merchandise API key issued at onboarding, sent as `Authorization: Bearer <merchandise
        API key>`. Distinct from `uveye-api-key`.'
  schemas:
    InspectionLookup:
      type: object
      description: Exactly one of inspectionId, vin, licensePlate or uniqueId must be supplied.
      properties:
        inspectionId:
          type: string
          description: A unique id of the inspection provided by the UVeye system; found in the scan page
            URL.
        vin:
          type: string
          description: The vehicle VIN provided by the manufacturer; found under vehicle info on the inspection
            page.
        licensePlate:
          type: string
          description: License plate of the vehicle; found under vehicle info on the inspection page.
        uniqueId:
          type: string
          description: The barcode of the vehicle (when given); found on the scan page.
        alertsOnly:
          type: boolean
          default: false
          description: When true the response returns only alert detections and hides warning detections.
        showTreadPolygons:
          type: boolean
          default: false
          description: When true, tread polygon coordinates are included.
      anyOf:
      - required:
        - inspectionId
      - required:
        - vin
      - required:
        - licensePlate
      - required:
        - uniqueId
    Inspection:
      type: object
      description: A single vehicle inspection with its per-module results.
      properties:
        inspectionId:
          type: string
          description: A unique id of the inspection.
        artemis:
          type: object
          description: Tire condition per wheel position (leftFront, leftRear, rightFront, rightRear).
        helios:
          type: object
          description: Undercarriage condition, including detections.
        atlas:
          type: object
          description: Exterior condition, including detections, coverImages and animatedFrames.
        apollo:
          type: object
          description: 'Interior condition (apolloInformation: interiorColor, interiorType, hasHeadrests,
            hasThirdRowSeating, isBioHazard).'
        overviewImage:
          type: string
          description: URL to the overview image of the vehicle.
        coverImage:
          type: string
          description: URL to the cover image of the vehicle.
        organizationId:
          type: string
          description: A unique id of the organization that generated the inspection.
        organizationDisplayName:
          type: string
          description: Name of the organization that generated the inspection.
        siteId:
          type: string
          description: A unique id of the site that generated the inspection.
        siteDisplayName:
          type: string
          description: Name of the site that generated the inspection.
        inspectedAt:
          type: string
          description: Date and time the inspection occurred.
        licensePlate:
          type: string
          description: License plate of the scanned vehicle.
        licensePlateUsStateAbbreviation:
          type: string
          description: Two-letter US state code shown on the license plate.
        vin:
