                  coverImages:
                    leftFront: ''
                    rightFront: ''
                    leftRear: ''
                    rightRear: ''
                  animatedFrames:
                    left:
                    - https://staging.api.uveye.app/v1/image?key=d1VMfKboj7RP9zIECrJP
                    - https://staging.api.uveye.app/v1/image?key=DzCqseYc3eD7dy68PSvT
                    top:
                    - https://staging.api.uveye.app/v1/image?key=03lRIemHCADHmmZvMwlM
