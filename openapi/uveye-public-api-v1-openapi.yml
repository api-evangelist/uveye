                    - https://staging.api.uveye.app/v1/image?key=P0EWc6G49YXtlsIm7uZL
                overviewImage: ''
                coverImage: ''
                organizationId: GoGP0TEVU6YVBXkSyb2e_mirror
                siteId: WwiWSdfhyWiMSOXfKKDx_mirror
                inspectedAt: '2025-12-01T23:44:09.000Z'
                licensePlate: DZ58SE
                licensePlateUsStateAbbreviation: FL
                vin: 3N1AB8CV9SY330347
                year: '2025'
                numberOfCylinders: null
                fuelType: Gasoline
                bodyType: Sedan/Saloon
                make: NISSAN
                model: Sentra
                trim: SV
                cabSubTrim: ''
                bedSubTrim: ''
                doorCount: 4
                exteriorColor: Black
                engineDisplacement: '2000'
